# Native owner desktop controls; HomeSI has no TV face dependency.
set $mod Mod4
bindsym $mod+Return exec kitty
bindsym $mod+KP_Enter exec kitty
bindsym Ctrl+Mod1+t exec kitty
bindsym $mod+b exec chromium
bindsym $mod+space exec wofi --show drun
bindsym Mod1+space exec wofi --show drun
bindsym $mod+q kill
bindsym $mod+c kill
bindsym Mod1+q kill
bindsym $mod+f fullscreen toggle
bindsym Mod1+Tab focus next
bindsym Mod1+Shift+Tab focus prev
bindsym $mod+Up focus up
bindsym $mod+Down focus down
bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Down move down
bindsym $mod+h resize shrink width 20 px
bindsym $mod+l resize grow width 20 px
bindsym $mod+j resize grow height 20 px
bindsym $mod+k resize shrink height 20 px
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+Ctrl+Left workspace prev
bindsym $mod+Ctrl+Right workspace next
bindsym $mod+Shift+Left move container to workspace prev
bindsym $mod+Shift+Right move container to workspace next
bindsym $mod+Shift+c reload
floating_modifier Mod4 normal
