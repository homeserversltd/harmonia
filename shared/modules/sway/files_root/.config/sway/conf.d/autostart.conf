# The direct Sway descendant holds the exclusive lease through the serialized native handoff.
# The captured socket is checked before any target stop or environment mutation.
exec /usr/bin/flock --exclusive "$XDG_RUNTIME_DIR/hometv-sway-handoff.lock" /usr/bin/systemd-run --user --wait --collect --service-type=oneshot --setenv=WAYLAND_DISPLAY --setenv=SWAYSOCK --property='ExecCondition=/usr/bin/swaymsg --quiet --socket=${SWAYSOCK} --type=get_version' --property='ExecStartPre=/usr/bin/systemctl --user stop hometv-sway-session.target graphical-session.target' --property='ExecStartPre=/usr/bin/systemctl --user reset-failed hs-*.service' --property='ExecStartPost=/usr/bin/systemctl --user start hometv-sway-session.target' /usr/bin/dbus-update-activation-environment --systemd WAYLAND_DISPLAY SWAYSOCK
# The session lifeline: when this Sway exits or dies, the graphical session stops with it,
# so no session service restart-loops against a dead display.
exec /usr/bin/systemd-run --user --collect --unit=hometv-sway-lifeline --setenv=SWAYSOCK --property='ExecStopPost=/usr/bin/systemctl --user stop --no-block graphical-session.target' /usr/bin/swaymsg -m -t subscribe '["shutdown"]'
# Start the owner's screen-off policy once per Sway session.
exec /usr/local/sbin/agathodaimon/caduceus-screen-idle
# Dwindle tiling: each new window splits the focused one along its longer side.
exec /usr/bin/autotiling
# Create the standard home folders (Desktop, Documents, Downloads, ...) once per session.
exec /usr/bin/xdg-user-dirs-update
