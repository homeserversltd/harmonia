# TV output policy.
output HEADLESS-1 mode 1920x1080
output * pos 0 0
# Integer scale until Debian trixie ships a wlroots that survives fractional scale (Debian #1132243).
output * scale 1
output * bg /usr/share/backgrounds/homeserver/homeserver-01.png fill
output Unknown-1 disable
exec_always /usr/local/sbin/agathodaimon/cli.py settings display apply
# Operator/Caduceus-owned; loaded after Sway defaults and never converged.
include ~/.config/sway/output-overrides.conf
