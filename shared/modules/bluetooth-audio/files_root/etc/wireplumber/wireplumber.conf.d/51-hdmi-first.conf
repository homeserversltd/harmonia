# HomeTV: the television is the speaker. Choose the HDMI profile for every
# onboard ALSA card; analog stays selectable in the audio manager.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.pci-*" } ]
    actions = { update-props = { device.profile = "output:hdmi-stereo+input:analog-stereo" } }
  }
]
