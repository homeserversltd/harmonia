{
  "css": "~/.config/waybar/style.css",
  "reload_style_on_change": true,
  "mode": "dock",
  "position": "bottom",
  "height": 36,
  "spacing": 4,
  "modules-left": ["custom/launcher", "custom/browser", "sway/workspaces", "wlr/taskbar"],
  "modules-center": ["cpu", "memory"],
  "modules-right": ["network", "pulseaudio", "tray", "clock"],
  "custom/launcher": {"format": "Applications", "on-click": "wofi --show drun", "tooltip": false},
  "custom/browser": {"format": "Browser", "on-click": "chromium", "tooltip": false},
  "sway/workspaces": {"on-click": "activate", "persistent-workspaces": {"1": [], "2": [], "3": []}},
  "wlr/taskbar": {"format": "{icon}", "icon-size": 20, "tooltip-format": "{title}", "on-click": "activate", "on-click-middle": "close"},
  "cpu": {"format": "CPU {usage}%", "interval": 5},
  "memory": {"format": "RAM {}%", "interval": 5},
  "network": {"format-ethernet": "{ifname}", "format-wifi": "{essid}", "format-disconnected": "Offline", "interval": 10},
  "pulseaudio": {"format": "Volume {volume}%", "format-muted": "Muted", "on-click": "pavucontrol"},
  "tray": {"icon-size": 21, "spacing": 10},
  "clock": {"format": "{:%H:%M}"}
}
