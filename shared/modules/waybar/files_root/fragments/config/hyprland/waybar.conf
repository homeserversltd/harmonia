{
  "include": ["~/.config/waybar/local.jsonc", "~/.config/waybar/meters.jsonc"],
  "css": "~/.config/waybar/style.css",
  "reload_style_on_change": true,
  "mode": "dock",
  "position": "bottom",
  "height": 36,
  "spacing": 4,
  "modules-left": ["hyprland/workspaces"],
  "modules-center": ["custom/cpu", "custom/temperature", "custom/gpu", "custom/memory", "custom/disk"],
  "hyprland/workspaces": {
    "format": "{name}",
    "on-click": "activate"
  }
}
