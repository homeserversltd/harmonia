server { listen 443 ssl; server_name agora.home.arpa; ssl_certificate /var/lib/caduceus/certs/agora.home.arpa.pem; ssl_certificate_key /var/lib/caduceus/certs/agora.home.arpa.key.pem; include "/etc/nginx/snippets/hestia/tls.conf"; client_max_body_size 100M; location = /config.json { alias /etc/element-web/config.json; add_header Cache-Control no-store; } root /usr/share/element-web;
index index.html;
location / {
    try_files $uri $uri/ /index.html;
} }
