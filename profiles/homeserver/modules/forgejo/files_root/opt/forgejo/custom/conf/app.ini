APP_NAME = Home Git Server
RUN_USER = git
RUN_MODE = prod

[database]
DB_TYPE  = postgres
HOST     = 127.0.0.1:5432
NAME     = forgejo
USER     = git
PASSWD   = ${PG_PASS}
SSL_MODE = disable

[repository]
ROOT = /opt/forgejo/repositories
ENABLE_LOCAL_PATH_MIGRATION = true

[server]
PROTOCOL         = http
DOMAIN           = git.home.arpa
HTTP_ADDR        = 127.0.0.1
HTTP_PORT        = 3000
ROOT_URL         = https://git.home.arpa/
LOCAL_ROOT_URL   = http://localhost:3000/
DISABLE_SSH      = false
SSH_ALLOW_UNEXPECTED_AUTHORIZED_KEYS = true
SSH_PORT         = 22
START_SSH_SERVER = false
OFFLINE_MODE     = false
EXTERNAL_URL     = https://git.home.arpa/

[mailer]
ENABLED = false

[service]
REGISTER_EMAIL_CONFIRM = false
ENABLE_NOTIFY_MAIL     = false
DISABLE_REGISTRATION   = true
ENABLE_CAPTCHA         = false
REQUIRE_SIGNIN_VIEW    = true

[picture]
DISABLE_GRAVATAR        = true
ENABLE_FEDERATED_AVATAR = false

[session]
PROVIDER = file

[log]
MODE      = file
LEVEL     = Info
ROOT_PATH = /var/log/forgejo

[security]
INSTALL_LOCK = true
SECRET_KEY   = ${SECRET_KEY}
