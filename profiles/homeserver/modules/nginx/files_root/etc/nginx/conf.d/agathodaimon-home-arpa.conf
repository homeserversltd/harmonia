server { listen 443 ssl; server_name home.arpa; ssl_certificate /var/lib/caduceus/certs/home.arpa.pem; ssl_certificate_key /var/lib/caduceus/certs/home.arpa.key.pem; include "/etc/nginx/snippets/hestia/tls.conf"; client_max_body_size 0; include "/etc/nginx/hestia/notes/cors-echo.conf"; error_page 403 404 500 502 503 504 = @fallback; location @fallback { try_files /fallback.html =503; add_header Cache-Control "no-cache, no-store, must-revalidate" always; add_header Pragma "no-cache" always; add_header Expires "0" always; } location /api/ { include "/etc/nginx/snippets/hestia/proxy.conf"; proxy_buffering off; proxy_read_timeout 60s; error_page 502 503 504 = @fallback; proxy_intercept_errors on; proxy_pass http://unix:/mnt/ramdisk/homeserver.sock:; } location /socket.io/ { include "/etc/nginx/snippets/hestia/proxy.conf"; proxy_buffering off; proxy_read_timeout 60s; error_page 502 503 504 = @fallback; proxy_intercept_errors on; proxy_pass http://unix:/mnt/ramdisk/homeserver.sock:; } root /var/www/homeserver/build;
