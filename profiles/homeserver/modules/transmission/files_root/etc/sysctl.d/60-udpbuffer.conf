# System-wide UDP and TCP Buffer Optimizations
# These settings improve network performance for high-throughput applications

# UDP buffer size optimizations - allows applications to request larger buffers
net.core.rmem_max = 4194304
net.core.wmem_max = 1048576

# UDP memory limits (min, pressure, max in pages)
net.ipv4.udp_mem = 262144 524288 1048576  # ~1GB max (1048576 * 4k = 4GB virtual cap)

# TCP optimizations for better throughput
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1

# Increase the maximum amount of memory available for network buffers
net.core.netdev_max_backlog = 5000

# Increase TCP buffer limits
net.ipv4.tcp_rmem = 4096 87380 4194304
net.ipv4.tcp_wmem = 4096 65536 1048576
