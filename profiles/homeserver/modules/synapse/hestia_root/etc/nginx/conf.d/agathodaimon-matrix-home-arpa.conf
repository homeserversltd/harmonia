server { listen 443 ssl; server_name matrix.home.arpa; ssl_certificate /var/lib/caduceus/certs/matrix.home.arpa.pem; ssl_certificate_key /var/lib/caduceus/certs/matrix.home.arpa.key.pem; include "/etc/nginx/snippets/hestia/tls.conf"; client_max_body_size 100M; location / { include "/etc/nginx/snippets/hestia/proxy.conf"; proxy_buffering off; proxy_read_timeout 600s; proxy_pass http://127.0.0.1:8008; } }
