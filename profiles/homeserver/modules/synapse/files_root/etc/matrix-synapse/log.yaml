version: 1
formatters:
  precise:
    format: '%(asctime)s - %(name)s - %(lineno)d - %(levelname)s - %(message)s'
filters:
  context:
    (): synapse.logging.context.LoggingContextFilter
handlers:
  console:
    class: logging.StreamHandler
    formatter: precise
    filters: [context]
root:
  level: WARNING
  handlers: [console]
disable_existing_loggers: false
