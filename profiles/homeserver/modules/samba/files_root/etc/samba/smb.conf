[global]
# General settings
workgroup = WORKGROUP
server string = Home NAS Server
netbios name = home
client min protocol = SMB2
server min protocol = SMB2

# Server role and browsing
server role = standalone server
wins support = yes
local master = yes
preferred master = yes
domain master = yes
os level = 255
browse list = yes
enhanced browsing = yes

# Name resolution and network settings
dns proxy = yes
multicast dns register = yes
name resolve order = bcast host
hostname lookups = no
socket address = 0.0.0.0
browse list = yes
msdfs root = no
host msdfs = no
unix extensions = yes

# Authentication settings
security = user
map to guest = bad user
unix password sync = yes
pam password change = yes
passwd program = /usr/bin/passwd %u
passwd chat = *Enter\snew\s*\spassword:* %n\n *Retype\snew\s*\spassword:* %n\n *password\supdated\ssuccessfully* .
obey pam restrictions = yes

# Printer sharing
load printers = no
printing = bsd
printcap name = /dev/null
disable spoolss = yes

# Performance tuning
socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=65536 SO_SNDBUF=65536
read raw = yes
write raw = yes
oplocks = yes
max xmit = 65535
dead time = 15
getwd cache = yes

# Security settings
client signing = auto
server signing = auto

[nas]
comment = NAS Storage
path = /mnt/nas
browseable = yes
read only = no
create mask = 0777
directory mask = 0777
valid users = owner
force user = owner
