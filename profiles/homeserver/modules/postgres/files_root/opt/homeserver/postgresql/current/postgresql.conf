# Connection settings
listen_addresses = 'localhost'
port = 5432
max_connections = 100
data_directory = '/opt/homeserver/postgresql/current'

# Memory settings
shared_buffers = 128MB
dynamic_shared_memory_type = posix

# Write ahead log
wal_level = replica
fsync = on
synchronous_commit = on
full_page_writes = on

# Authentication
password_encryption = scram-sha-256

# Locale and encoding
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english' 