# Memory Configuration
shared_buffers = 1GB                    # Dedicated 1GB for PostgreSQL
effective_cache_size = 2GB              # Assume 2GB available for OS caching
maintenance_work_mem = 128MB            # Reduced for more conservative memory usage
work_mem = 16MB                         # Conservative per-operation memory
temp_buffers = 16MB                     # Reduced temp table memory per session

# Durability Configuration
synchronous_commit = on                 # Ensure durability
full_page_writes = on                   # Protect against partial page writes
fsync = on                             # Ensure data is synced to disk
wal_sync_method = fsync                # Most reliable method
wal_writer_delay = 200ms               # More frequent WAL writes

# Disk Configuration
random_page_cost = 1.3                 # Optimized for SSD (slightly higher than NVMe)
effective_io_concurrency = 100         # Moderate for SSD (lower than NVMe)
max_parallel_workers = 4               # Conservative for quad-core
max_parallel_workers_per_gather = 2    # Half of max_parallel_workers
max_parallel_maintenance_workers = 2    # Half of max_parallel_workers

# Checkpoint Configuration
checkpoint_completion_target = 0.9     # Spread out checkpoint writes
checkpoint_timeout = 10min             # More frequent checkpoints
max_wal_size = 2GB                    # Reduced for more frequent checkpoints
min_wal_size = 1GB                    # Keep reasonable WAL size
wal_buffers = 16MB                    # Help with concurrent transactions

# Query Planning
default_statistics_target = 100        # Default is fine for simple queries
cpu_tuple_cost = 0.03
cpu_index_tuple_cost = 0.01

# Background Writer
bgwriter_delay = 200ms                # More frequent background writes
bgwriter_lru_maxpages = 100          # Process more pages per round
bgwriter_lru_multiplier = 2.0        # More aggressive background writing 