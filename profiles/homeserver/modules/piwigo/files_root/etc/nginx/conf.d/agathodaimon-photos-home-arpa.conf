server { listen 443 ssl; server_name photos.home.arpa; ssl_certificate /var/lib/caduceus/certs/photos.home.arpa.pem; ssl_certificate_key /var/lib/caduceus/certs/photos.home.arpa.key.pem; include "/etc/nginx/snippets/hestia/tls.conf"; client_max_body_size 1m; include "/etc/nginx/hestia/notes/cache-static.conf"; root /opt/piwigo/piwigo;
index index.php;
location / {
    try_files $uri $uri/ /index.php$is_args$args;
}
location ~ [^/]\.php(/|$) {
    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    try_files $fastcgi_script_name =404;
    set $path_info $fastcgi_path_info;
    include fastcgi.conf;
    fastcgi_param PATH_INFO $path_info;
    fastcgi_param HTTP_HOST $host;
    fastcgi_param SERVER_NAME $host;
    fastcgi_index index.php;
    fastcgi_read_timeout 60s;
    fastcgi_pass 127.0.0.1:8080;
} }
