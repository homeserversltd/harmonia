# HomeServer is IPv4-only by the operator's ruling of 2026-11-02.
# IPv4 forwarding connects LAN clients to the internet via nftables NAT.
# Disable IPv6 on all, new interfaces, and lo: ::1 on lo let nginx resolve
# localhost to IPv6 at boot while upstream services listened on IPv4.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 1
