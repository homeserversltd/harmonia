#!/usr/sbin/nft -f

flush ruleset

# Define variables
define lan_if = lan0
define wan_if = wan0
define lan_net = 192.168.123.0/24

# Define services sets
define protocols = { tcp, udp }

table inet filter {
    # Allow established and related connections
    chain input {
        type filter hook input priority 0;

        ct state { related, established } accept
        iif "lo" accept
        ip protocol icmp accept

        # Allow SSH temporarily during setup
        tcp dport 22 accept comment "temporary-ssh-access"

        iifname $lan_if accept
        iifname "tailscale0" accept

        # Sampled log for input that reached here; over-limit hits silent drop below.
        limit rate 5/second burst 20 packets log prefix "nftables record all input: " flags all counter drop
        drop comment "final-drop"
    }

    # Forwarding rules for LAN to WAN and vice versa
    chain forward {
        type filter hook forward priority filter;
        policy drop;
        ct state established,related accept

        iif $lan_if oif $lan_if accept
        iif $lan_if oif $wan_if accept
        iif $wan_if oif $lan_if ct state established,related accept
    }

    # Default accept for outgoing
    chain output {
        type filter hook output priority 0;
        accept
    }
}

# NAT for LAN to internet
table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oif $wan_if masquerade;
    }
}
