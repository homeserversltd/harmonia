# Start Kea only after lan0 is up. Kea binds at startup and does not retry; if lan0 is not
# ready it logs "the interface lan0 is not running" and stays running without serving DHCP.
# systemd-networkd-wait-online.service alone can complete before lan0 is ready; wait for lan0
# explicitly so Kea never starts until the interface is there (see ISC Kea #3241, unix.stackexchange 210604).
[Unit]
After=systemd-networkd-wait-online.service
Wants=systemd-networkd-wait-online.service

[Service]
# Block until lan0 is configured and online; then Kea can bind. Timeout so boot does not hang.
ExecStartPre=/usr/lib/systemd/systemd-networkd-wait-online --interface=lan0 --timeout=60
