// -*- mode: jsonc -*-
{
"css": "~/.config/waybar/style.css",
"reload_style_on_change":true,
"mode": "dock",

"position": "bottom",
	"height": 36,
    "spacing": 4, // Gaps between modules (4px)
    "modules-left": [
        "custom/launcher",
        "custom/fetch",
        "wlr/taskbar",
        "sway/workspaces"
    ],
    "modules-center": [
        "custom/cpu",
        "custom/temperature",
        "custom/memory",
        "custom/disk"
    ],
    "modules-right": [
        "custom/drives",
        "custom/settings",
        "tray",
        "pulseaudio",
        "custom/power",
        "custom/restart",
        "clock"
    ],
"custom/power": {
  "format": "󰐥",
  "on-click": "notify-send 'Power Button' 'Double-click to power off your system'",
  "on-double-click": "systemctl poweroff",
  "tooltip": false
},
"custom/restart": {
  "format": "󰑓",
  "on-click": "notify-send 'Restart Button' 'Double-click to restart your system'",
  "on-double-click": "systemctl reboot",
  "tooltip": false
},
"custom/launcher": {
        "format": "󱓟",
        "on-click": "curl -sS -m 5 -X POST http://127.0.0.1:8787/api/v1/face/launch -H 'Content-Type: application/json' -d '{\"menu\":true}'",
    },
"sway/workspaces": {
  "format": "{icon}",
  "on-click": "activate",
        "persistent-workspaces": {
        "1": [],
        "2": [],
        "3": []
        },
         "format-icons": {
            "1": "",
            "2": "",
            "3": "",
            "focused": "",
            "default": ""
        },
        "sort-by-number": true
        },
    "custom/cpu": {
        "exec": "curl -sS -m 5 -X POST http://127.0.0.1:8787/api/v1/face/meter -H 'Content-Type: application/json' -d '{\"kind\":\"cpu\"}'",
        "return-type": "json",
        "format": "{}",
        "interval": 3,
        "tooltip": true
    },
    "custom/temperature": {
        "exec": "curl -sS -m 5 -X POST http://127.0.0.1:8787/api/v1/face/meter -H 'Content-Type: application/json' -d '{\"kind\":\"temp\"}'",
        "return-type": "json",
        "format": "{}",
        "interval": 3,
        "tooltip": true
    },
    "custom/memory": {
        "exec": "curl -sS -m 5 -X POST http://127.0.0.1:8787/api/v1/face/meter -H 'Content-Type: application/json' -d '{\"kind\":\"ram\"}'",
        "return-type": "json",
        "format": "{}",
        "interval": 5,
        "tooltip": true
    },
    "custom/disk": {
        "exec": "curl -sS -m 5 -X POST http://127.0.0.1:8787/api/v1/face/meter -H 'Content-Type: application/json' -d '{\"kind\":\"disk\"}'",
        "return-type": "json",
        "format": "{}",
        "interval": 30,
        "tooltip": true
    },

    "pulseaudio": {
        "format": "{volume}% {icon}",
        "format-muted": "󰖁",
  "on-click": "curl -sS -m 5 -X POST http://127.0.0.1:8787/api/v1/face/app -H 'Content-Type: application/json' -d '{\"id\":\"pavucontrol\",\"action\":\"toggle\"}'",
        "scroll-step": 5,
        "on-scroll-up": "curl -sS -m 5 -X POST http://127.0.0.1:8787/api/v1/face/volume -H 'Content-Type: application/json' -d '{\"step\":\"+5\"}'",
        "on-scroll-down": "curl -sS -m 5 -X POST http://127.0.0.1:8787/api/v1/face/volume -H 'Content-Type: application/json' -d '{\"step\":\"-5\"}'",
        "format-icons": {
                "default": ["", "󰕾", ""],
                        }
    },
"wlr/taskbar": {
        "format": "{icon}",
        "icon-size": 20,
        "tooltip-format": "{title}",
        "on-click": "activate",
        "on-click-middle": "close"
},
"clock": {
    "format": "{:%H:%M}  ",
    "format-alt": "{:%A, %B %d, %Y (%R)} ",
"tooltip-format": "<tt><span font-size='10pt'>{calendar}</span></tt>",    "calendar": {
                "mode"          : "year",
                "mode-mon-col"  : 3,
                "weeks-pos"     : "right",
                "on-scroll"     : 1,
                "on-click-right": "mode",
                "format": {
"months": "<span color='#6699CC'><b>{}</b></span>",
      "days": "<span color='#F0F0F0'><b>{}</b></span>",
      "weeks": "<span color='#6699CC'><b>W{}</b></span>",
      "weekdays": "<span color='#8FBC8F'><b>{}</b></span>",
      "today": "<span color='#FF8C00'><b><u>{}</u></b></span>"                             }
                },
    "actions":  {
                "on-click-right": "mode",
                "on-click-forward": "tz_up",
                "on-click-backward": "tz_down",
                "on-scroll-up": "shift_up",
                "on-scroll-down": "shift_down"
                }
},
"tray": {
        "icon-size": 21,
        "spacing": 10,
        "show-passive-items":true
        },
"custom/fetch": {
    "format": "",
    "on-click": "curl -sS -m 5 -X POST http://127.0.0.1:8787/api/v1/face/fetch -H 'Content-Type: application/json' -d '{}'",
    "tooltip-format": "Fetches all windows to current workspace"
  },
"custom/drives":{
  "format": "󰕓",
  "on-click": "curl -sS -m 5 -X POST http://127.0.0.1:8787/api/v1/face/app -H 'Content-Type: application/json' -d '{\"id\":\"gnome-disks\",\"action\":\"toggle\"}'",
  "tooltip-format": "Drive Management"
  },
"custom/settings": {
  "format": "{}",
  "on-click": "/usr/local/sbin/agathodaimon/cli.py gui settings",
  "return-type": "json",
  "exec": "curl -sS -m 5 -X POST http://127.0.0.1:8787/api/v1/face/badge -H 'Content-Type: application/json' -d '{}' 2>/dev/null | python3 -c 'import json,sys\ntry: b=json.load(sys.stdin)\nexcept Exception: b={}\nn=b.get(\"pending_count\") or 0\nprint(json.dumps({\"text\":\"\\uf013\"+(\" %d\"%n if n else \"\"),\"class\":b.get(\"class\",\"\"),\"tooltip\":\"Settings \\u2014 \"+b.get(\"tooltip\",\"update state unavailable\")}))'",
  "interval": 10,
  "tooltip": true
  }
}
