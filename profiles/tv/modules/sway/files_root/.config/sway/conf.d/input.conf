input type:keyboard {
    xkb_layout us
}

input type:touchpad {
    tap enabled
    middle_emulation enabled
    pointer_accel 0.3
    scroll_factor 1.6
}

input type:pointer {
    pointer_accel 0.3
    scroll_factor 1.6
}

# Operator/Caduceus-owned; loaded after Sway defaults and never converged.
include ~/.config/sway/input-overrides.conf
