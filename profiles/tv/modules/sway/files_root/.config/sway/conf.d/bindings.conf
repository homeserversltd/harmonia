# Source Hyprland Mod4 (SUPER) -> Sway Mod4; Mod1 (ALT) remains Alt.
bindsym Mod4+q kill
bindsym Mod4+c kill
bindsym Mod1+q kill
bindsym Mod4+f fullscreen toggle
bindsym Ctrl+Mod1+Delete exec curl -sS -m 5 -X POST http://127.0.0.1:8787/api/v1/face/bar -H 'Content-Type: application/json' -d '{"action":"toggle"}'
bindsym Ctrl+Shift+Escape exec curl -sS -m 5 -X POST http://127.0.0.1:8787/api/v1/face/bar -H 'Content-Type: application/json' -d '{"action":"toggle"}'
bindsym Mod1+z exec curl -sS -m 5 -X POST http://127.0.0.1:8787/api/v1/face/bar -H 'Content-Type: application/json' -d '{"action":"toggle"}'
bindsym Mod4+z exec curl -sS -m 5 -X POST http://127.0.0.1:8787/api/v1/face/bar -H 'Content-Type: application/json' -d '{"action":"toggle"}'

# Global Alt-Tab routes focus direction through the face.
bindsym Mod1+Tab exec curl -sS -m 5 -X POST http://127.0.0.1:8787/api/v1/face/focus -H 'Content-Type: application/json' -d '{"direction":"next"}'
bindsym Mod1+Shift+Tab exec curl -sS -m 5 -X POST http://127.0.0.1:8787/api/v1/face/focus -H 'Content-Type: application/json' -d '{"direction":"prev"}'

bindsym --locked XF86AudioRaiseVolume exec curl -sS -m 5 -X POST http://127.0.0.1:8787/api/v1/face/volume -H 'Content-Type: application/json' -d '{"step":"+5"}'
bindsym --locked XF86AudioLowerVolume exec curl -sS -m 5 -X POST http://127.0.0.1:8787/api/v1/face/volume -H 'Content-Type: application/json' -d '{"step":"-5"}'
bindsym --locked --no-repeat XF86AudioMute exec curl -sS -m 5 -X POST http://127.0.0.1:8787/api/v1/face/volume -H 'Content-Type: application/json' -d '{"step":"mute"}'
bindsym Mod4+e exec dolphin
bindsym Mod4+Return exec kitty
bindsym Mod4+KP_Enter exec kitty
bindsym Ctrl+Mod1+t exec kitty
bindsym Mod4+s exec grim -g "$(slurp)" - | swappy -f -
bindsym Mod4+space exec curl -sS -m 5 -X POST http://127.0.0.1:8787/api/v1/face/launch -H 'Content-Type: application/json' -d '{"menu":true}'
bindsym Mod1+space exec curl -sS -m 5 -X POST http://127.0.0.1:8787/api/v1/face/launch -H 'Content-Type: application/json' -d '{"menu":true}'
bindsym Mod4+t exec kate
bindsym Mod4+k exec kcalc

bindsym Mod4+Up focus up
bindsym Mod4+Down focus down
bindsym Mod4+Shift+Up move up
bindsym Mod4+Shift+Down move down
bindsym Mod4+h resize shrink width 20 px
bindsym Mod4+l resize grow width 20 px
bindsym Mod4+j resize grow height 20 px

# Hyprland e-1/e+1 workspace movement becomes Sway prev/next.
bindsym Mod4+Ctrl+Left workspace prev
bindsym Mod4+Ctrl+Right workspace next
bindsym Mod4+Shift+Left move container to workspace prev, workspace prev
bindsym Mod4+Shift+Right move container to workspace next, workspace next
bindsym Mod4+Ctrl+Shift+Left move container to workspace prev, workspace prev
bindsym Mod4+Ctrl+Shift+Right move container to workspace next, workspace next
bindsym Mod4+1 workspace number 1
bindsym Mod4+2 workspace number 2
bindsym Mod4+3 workspace number 3

# Super+left moves and Super+right resizes floating windows.
floating_modifier Mod4 normal
# Bridge Super+Shift+left to Sway's native right-button resize gesture.
bindsym --whole-window Mod4+Shift+button1 seat - cursor press button3, seat - cursor release button3
