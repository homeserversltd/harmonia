# The direct Sway descendant holds the exclusive lease through the serialized native handoff.
# The captured socket is checked before any target stop or environment mutation.
exec /usr/bin/flock --exclusive "$XDG_RUNTIME_DIR/hometv-sway-handoff.lock" /usr/bin/systemd-run --user --wait --collect --service-type=oneshot --setenv=WAYLAND_DISPLAY --setenv=SWAYSOCK --property='ExecCondition=/usr/bin/swaymsg --quiet --socket=${SWAYSOCK} --type=get_version' --property='ExecStartPre=/usr/bin/systemctl --user stop hometv-sway-session.target graphical-session.target' --property='ExecStartPost=/usr/bin/systemctl --user start hometv-sway-session.target' /usr/bin/dbus-update-activation-environment --systemd WAYLAND_DISPLAY SWAYSOCK
