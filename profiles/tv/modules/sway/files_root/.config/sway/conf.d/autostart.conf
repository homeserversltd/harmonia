# Import the complete session environment before starting graphical-session.target.
# That is the WantedBy/Requisite target for hs-waybar.service and hs-dunst.service.
exec sh -c 'set -eu; export QT_QPA_PLATFORM="wayland;xcb" QT_AUTO_SCREEN_SCALE_FACTOR=1 XCURSOR_SIZE=40 HYPRCURSOR_SIZE=40 XDG_SESSION_TYPE=wayland QT_QPA_PLATFORMTHEME=kde XDG_SESSION_DESKTOP=sway XDG_CURRENT_DESKTOP=sway QT_WAYLAND_DISABLE_WINDOWDECORATION=1 GDK_BACKEND="wayland,x11" GTK_USE_PORTAL=1 SDL_VIDEODRIVER=wayland CLUTTER_BACKEND=wayland; export WAYLAND_DISPLAY SWAYSOCK; dbus-update-activation-environment --systemd QT_QPA_PLATFORM QT_AUTO_SCREEN_SCALE_FACTOR XCURSOR_SIZE HYPRCURSOR_SIZE XDG_SESSION_TYPE QT_QPA_PLATFORMTHEME XDG_SESSION_DESKTOP XDG_CURRENT_DESKTOP QT_WAYLAND_DISABLE_WINDOWDECORATION GDK_BACKEND GTK_USE_PORTAL SDL_VIDEODRIVER CLUTTER_BACKEND WAYLAND_DISPLAY SWAYSOCK; systemctl --user import-environment QT_QPA_PLATFORM QT_AUTO_SCREEN_SCALE_FACTOR XCURSOR_SIZE HYPRCURSOR_SIZE XDG_SESSION_TYPE QT_QPA_PLATFORMTHEME XDG_SESSION_DESKTOP XDG_CURRENT_DESKTOP QT_WAYLAND_DISABLE_WINDOWDECORATION GDK_BACKEND GTK_USE_PORTAL SDL_VIDEODRIVER CLUTTER_BACKEND WAYLAND_DISPLAY SWAYSOCK; systemctl --user start graphical-session.target; systemctl --user start hs-waybar.service hs-dunst.service'
