# Eight protocol-specific forms cover the four effective source match families.
# KCalc: native Wayland app_id and Xwayland class; both stay sticky.
for_window [app_id="^org[.]kde[.]kcalc$"] floating enable, move position center, sticky enable
for_window [class="^org[.]kde[.]kcalc$"] floating enable, move position center, sticky enable

# Bitwarden application identifier/class rules.
for_window [app_id="^(Bitwarden|bitwarden)$"] floating enable, move position center
for_window [class="^(Bitwarden|bitwarden)$"] floating enable, move position center
# Title rules are explicitly split by protocol so native and Xwayland titles match.
for_window [app_id=".*" title="^Bitwarden$"] floating enable, move position center
for_window [class=".*" title="^Bitwarden$"] floating enable, move position center

# Chromium extension app_id/class; source class + initial_class collapse to class.
for_window [app_id="^chrome-nngceckbapebfimnlniiiahkandclblb-.*$"] floating enable, move position center
for_window [class="^chrome-nngceckbapebfimnlniiiahkandclblb-.*$"] floating enable, move position center
