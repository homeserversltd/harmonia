# Keep the TV workspaces on one available display; create the three named workspaces.
workspace 1 output *
workspace 2 output *
workspace 3 output *
workspace number 1
workspace number 2
workspace number 3
workspace number 1

# One window: no border, no gap. Two or more: thin borders and a gap between.
default_border pixel 2
default_floating_border pixel 2
gaps inner 8
gaps outer 0
smart_borders on
smart_gaps on

# Sway has no compositor animation, blur, or shadow controls; none are enabled.
