[package]
name = "harmonia"
version = "0.1.0"
edition = "2021"
description = "Rust update manager and appliance-profile execution engine"
license = "AGPL-3.0-or-later"
repository = "https://github.com/homeserversltd/harmonia"

[workspace]
members = ["."]
resolver = "2"

[features]
test-facade = []

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
tempfile = "3"
